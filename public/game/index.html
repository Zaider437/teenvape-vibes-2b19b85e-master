<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Sweet Zombie Hunt: Halloween Vape Edition</title>
    <link rel="stylesheet" href="style.css" />
    <!-- three.js грузим ЛОКАЛЬНО: CDN (cdnjs/jsdelivr) периодически отдаёт пустой ответ,
         из-за чего глобальный THREE не создавался и игра падала на тёмный экран -->
    <script src="vendor/three.min.js"></script>
    <script src="vendor/GLTFLoader.js"></script>
  </head>
  <body>
    <div id="gameWrap"></div>
    <div id="hud">
      <div class="score">Очки: <span id="score">0</span></div>
      <div>Рекорд: <span id="best">0</span></div>
      <div>Уровень: <span id="level">1</span></div>
      <div id="upgradeLine" style="margin-left: 12px; color: #7dd3fc">Улучшения: нет</div>
    </div>
    <button id="backToSiteBtn" type="button">← На сайт</button>
    <div id="overlay">
      <div id="overlayInner"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
